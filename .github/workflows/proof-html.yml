name: Validate storefront and database policies
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: mr1_fixture_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p test_provision.py -v
      - run: python3 -m unittest discover -s tests -p test_domain.py -v
      - run: python3 -m unittest discover -s tests -p test_email_settings.py -v
      - run: npm run test:database
        env:
          MR1_TEST_DATABASE_URL: postgres://postgres:mr1_fixture_local@127.0.0.1:5432/postgres
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
