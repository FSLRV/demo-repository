name: Authorize existing MR1 administrator
on:
  workflow_dispatch:
    inputs:
      email:
        description: E-mail da conta já criada e confirmada no Supabase Auth
        required: true
        type: string
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and authorize confirmed account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MR1_ADMIN_EMAIL: ${{ inputs.email }}
        run: python3 scripts/provision-supabase.py --existing-admin-only
